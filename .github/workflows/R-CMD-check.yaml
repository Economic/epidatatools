# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
# Changed from check-standard.yaml: runs on pull requests into main and dev (main only
# receives merges from dev), and passes API keys to one job only, so the API tests run
# once per check instead of on every platform (BLS allows 500 queries a day). There is
# no R-devel job: r-universe checks R-devel on Linux and Windows when a release is built.
on:
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'release', api-keys: true}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Empty for jobs without api-keys, so the live API tests skip (see
      # tests/testthat/helper-live-api.R). API examples run only in the pkgdown build.
      EPIDATATOOLS_LIVE_TESTS: ${{ matrix.config.api-keys && 'true' || '' }}
      BLS_API_KEY: ${{ matrix.config.api-keys && secrets.BLS_API_KEY || '' }}
      BEA_API_KEY: ${{ matrix.config.api-keys && secrets.BEA_API_KEY || '' }}
      FRED_API_KEY: ${{ matrix.config.api-keys && secrets.FRED_API_KEY || '' }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
